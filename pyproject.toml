[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bisimlab"
version = "0.1.0"
description = "Bounded agent-protocol bisimulation, modal witnesses and independent report replay"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
bisimlab = "bisimlab.__main__:main"
[tool.setuptools.packages.find]
include = ["bisimlab*"]
